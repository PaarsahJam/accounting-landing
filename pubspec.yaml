name: accounting_app
description: A production-ready cross-platform accounting application.
publish_to: none
version: 0.1.0
environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: any
  riverpod_annotation: any

  # Navigation
  go_router: any

  # Networking
  dio: any

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: any

  # Fonts
  google_fonts: any

  # Storage
  flutter_secure_storage: any
  flutter_dotenv: any

  # Models / Codegen helpers (annotations)
  freezed_annotation: any
  json_annotation: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  build_runner: any
  riverpod_generator: any
  freezed: any
  json_serializable: any

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
