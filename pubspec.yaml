name: accounting_app
description: A production-ready cross-platform accounting application built with Flutter.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: any
  riverpod_annotation: any

  # Navigation
  go_router: any

  # Networking
  dio: any

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: any

  # Fonts
  google_fonts: any

  # Storage
  flutter_secure_storage: any
  flutter_dotenv: any

  # Mobile experience — stubs for connectivity and image picking;
  # replace with real packages when available.

  # Models / Codegen helpers (annotations)
  freezed_annotation: any
  json_annotation: any

  # Database
  drift: any
  sqlite3_flutter_libs: any
  path_provider: any
  path: any

  # ML Kit — on-device OCR for document scanning
  google_mlkit_text_recognition: any

  # Auth
  crypto: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  build_runner: any
  riverpod_generator: any
  freezed: any
  json_serializable: any
  drift_dev: any

flutter:
  generate: true
  uses-material-design: true
